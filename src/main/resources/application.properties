spring.application.name=chatapp

# ---- PostgreSQL datasource ----
# Update these to match your local DB. Create the DB first:
#   createdb chatapp
spring.datasource.url=jdbc:postgresql://localhost:5432/chatapp
spring.datasource.username=hayleyprince
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# 'update' auto-creates/updates tables from entities - convenient for dev.
# Switch to 'validate' once you introduce a real migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Server ----
server.port=8081

# ---- CORS / WebSocket allowed origins ----
# Comma-separated list of origins permitted to call the REST API and open
# WebSocket connections. Add your real frontend origin(s) here in production
# and never use "*" once auth is in play.
app.allowed-origins=http://localhost:8080,http://127.0.0.1:8080

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false