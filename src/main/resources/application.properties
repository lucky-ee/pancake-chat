spring.application.name=chatapp

# ---- Local overrides ----
# Anything in ./application-local.properties (git-ignored, project root) wins
# over the values below. That's the place for your real DB credentials —
# keep them out of this file, which is in version control.
spring.config.import=optional:file:./application-local.properties

# ---- PostgreSQL datasource ----
# Credentials come from the environment, with dev-friendly defaults so a fresh
# clone starts up. Override via DB_USER / DB_PASSWORD env vars, or by setting
# spring.datasource.* in application-local.properties.
# Create the DB first:
#   createdb chatapp
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chatapp}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# 'update' auto-creates/updates tables from entities - convenient for dev.
# Switch to 'validate' once you introduce a real migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Server ----
server.port=8081

# ---- CORS / WebSocket allowed origins ----
# Comma-separated list of origins permitted to call the REST API and open
# WebSocket connections. Add your real frontend origin(s) here in production
# and never use "*" once auth is in play.
app.allowed-origins=http://localhost:8081,http://127.0.0.1:8081,http://192.168.1.93:8081

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false