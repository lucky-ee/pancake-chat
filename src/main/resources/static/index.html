<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Chat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== LOGIN / REGISTER SCREEN ===== -->
<section id="auth-screen" class="screen">
  <div class="card">
    <h1>💬 Java Chat</h1>
    <p class="subtitle">Sign in or create an account</p>
    <input id="auth-username" type="text" placeholder="Username" autocomplete="username">
    <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password">
    <div class="btn-row">
      <button id="login-btn" class="primary">Login</button>
      <button id="register-btn" class="secondary">Register</button>
    </div>
    <p id="auth-error" class="error"></p>
  </div>
</section>

<!-- ===== ROOM LIST SCREEN ===== -->
<section id="rooms-screen" class="screen hidden">
  <div class="card wide">
    <div class="rooms-header">
      <h1>Rooms</h1>
      <span id="whoami"></span>
    </div>
    <div class="btn-row">
      <input id="new-room-name" type="text" placeholder="New room name">
      <button id="create-room-btn" class="primary">Create</button>
    </div>
    <ul id="room-list"></ul>
    <p id="rooms-error" class="error"></p>
    <button id="logout-btn" class="link">Log out</button>
  </div>
</section>

<!-- ===== CHAT SCREEN ===== -->
<section id="chat-screen" class="screen hidden">
  <div class="chat-container">
    <div class="chat-header">
      <button id="back-btn" class="link">&larr; Rooms</button>
      <h2 id="chat-room-name"></h2>
      <span id="chat-status" class="status-dot disconnected"></span>
    </div>
    <div id="messages" class="messages"></div>
    <div id="typing-indicator" class="typing-indicator hidden"></div>
    <form id="message-form" class="message-form">
      <input id="message-input" type="text" placeholder="Type a message…" autocomplete="off">
      <button type="submit" class="primary">Send</button>
    </form>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
